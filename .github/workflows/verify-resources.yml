name: Verify Crisis Resources

on:
  schedule:
    - cron: '0 6 1,15 * *'  # 1st and 15th of every month at 6am UTC
  workflow_dispatch:          # manual trigger

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify resources
        id: verify
        continue-on-error: true
        run: node .github/scripts/verify-resources.js

      - name: Commit updated timestamps
        if: steps.verify.outputs.updated == 'true'
        run: |
          git config user.name "safechat-bot"
          git config user.email "safechat-bot@users.noreply.github.com"
          git add data/crisis-resources.json
          git commit -m "chore: update resource verification timestamps"
          git push

      - name: Create issue for failures
        if: steps.verify.outputs.failures != ''
        uses: actions/github-script@v7
        with:
          script: |
            const failures = JSON.parse(process.env.FAILURES);
            const body = failures.map(f =>
              `- **${f.country}** — ${f.name}: ${f.issue}`
            ).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto] ${failures.length} helpline(s) need verification`,
              body: `The automated verification found issues with the following resources:\n\n${body}\n\nPlease verify manually and update \`data/crisis-resources.json\`.`,
              labels: ['verification', 'help wanted']
            });
        env:
          FAILURES: ${{ steps.verify.outputs.failures }}
