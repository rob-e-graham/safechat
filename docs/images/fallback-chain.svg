<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg3)" rx="16"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Why Safechat Never Fails</text>
  <text x="450" y="65" text-anchor="middle" fill="#888" font-size="13">4-layer offline fallback. The user always gets help, even with no internet.</text>

  <!-- Layer 1 -->
  <rect x="50" y="95" width="800" height="70" rx="12" fill="#152a1a" stroke="#2ecc71" stroke-width="1.5"/>
  <circle cx="90" cy="130" r="22" fill="#2ecc71" opacity="0.15" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="90" y="136" text-anchor="middle" fill="#2ecc71" font-size="16" font-weight="700">1</text>
  <text x="130" y="120" fill="#2ecc71" font-size="15" font-weight="700">jsDelivr CDN</text>
  <text x="130" y="140" fill="#aaa" font-size="12">Latest crisis data from GitHub via global CDN. Updates within 24h of any PR merge.</text>
  <text x="130" y="155" fill="#666" font-size="11">cdn.jsdelivr.net/gh/rob-e-graham/safechat@main/data/crisis-resources.json</text>
  <rect x="730" y="115" width="100" height="28" rx="6" fill="#1a3a1a" stroke="#2ecc71" stroke-width="1"/>
  <text x="780" y="134" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="600">PRIMARY</text>

  <!-- Arrow -->
  <text x="450" y="182" text-anchor="middle" fill="#555" font-size="12">CDN down?</text>
  <path d="M 450 186 L 450 198" stroke="#555" stroke-width="1.5" marker-end="url(#arr3)"/>
  <defs><marker id="arr3" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5" fill="#555"/></marker></defs>

  <!-- Layer 2 -->
  <rect x="50" y="200" width="800" height="70" rx="12" fill="#1a2540" stroke="#3498db" stroke-width="1.5"/>
  <circle cx="90" cy="235" r="22" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="1.5"/>
  <text x="90" y="241" text-anchor="middle" fill="#3498db" font-size="16" font-weight="700">2</text>
  <text x="130" y="225" fill="#3498db" font-size="15" font-weight="700">GitHub Raw</text>
  <text x="130" y="245" fill="#aaa" font-size="12">Same data, different infrastructure. GitHub's raw file server is independent from jsDelivr.</text>
  <text x="130" y="260" fill="#666" font-size="11">raw.githubusercontent.com/rob-e-graham/safechat/main/data/crisis-resources.json</text>
  <rect x="730" y="220" width="100" height="28" rx="6" fill="#152540" stroke="#3498db" stroke-width="1"/>
  <text x="780" y="239" text-anchor="middle" fill="#3498db" font-size="11" font-weight="600">FALLBACK 1</text>

  <!-- Arrow -->
  <text x="450" y="287" text-anchor="middle" fill="#555" font-size="12">GitHub down too?</text>
  <path d="M 450 291 L 450 303" stroke="#555" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Layer 3 -->
  <rect x="50" y="305" width="800" height="70" rx="12" fill="#2a2515" stroke="#f5a623" stroke-width="1.5"/>
  <circle cx="90" cy="340" r="22" fill="#f5a623" opacity="0.15" stroke="#f5a623" stroke-width="1.5"/>
  <text x="90" y="346" text-anchor="middle" fill="#f5a623" font-size="16" font-weight="700">3</text>
  <text x="130" y="330" fill="#f5a623" font-size="15" font-weight="700">localStorage Cache</text>
  <text x="130" y="350" fill="#aaa" font-size="12">Last successful data load is cached on the device. Works completely offline.</text>
  <text x="130" y="365" fill="#666" font-size="11">Cached automatically on every successful CDN or GitHub fetch. Survives browser restarts.</text>
  <rect x="730" y="325" width="100" height="28" rx="6" fill="#2a2515" stroke="#f5a623" stroke-width="1"/>
  <text x="780" y="344" text-anchor="middle" fill="#f5a623" font-size="11" font-weight="600">FALLBACK 2</text>

  <!-- Arrow -->
  <text x="450" y="392" text-anchor="middle" fill="#555" font-size="12">First ever visit, no internet?</text>
  <path d="M 450 396 L 450 408" stroke="#555" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Layer 4 -->
  <rect x="50" y="410" width="800" height="70" rx="12" fill="#2a1520" stroke="#e94560" stroke-width="1.5"/>
  <circle cx="90" cy="445" r="22" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="1.5"/>
  <text x="90" y="451" text-anchor="middle" fill="#e94560" font-size="16" font-weight="700">4</text>
  <text x="130" y="435" fill="#e94560" font-size="15" font-weight="700">Inline Emergency Numbers</text>
  <text x="130" y="455" fill="#aaa" font-size="12">34 countries of emergency numbers are baked into the JavaScript bundle itself.</text>
  <text x="130" y="470" fill="#fff" font-size="12" font-weight="600">The user ALWAYS gets a number. No exceptions.</text>
  <rect x="730" y="430" width="100" height="28" rx="6" fill="#2a1520" stroke="#e94560" stroke-width="1"/>
  <text x="780" y="449" text-anchor="middle" fill="#e94560" font-size="11" font-weight="600">LAST RESORT</text>

  <!-- Footer -->
  <text x="450" y="497" text-anchor="middle" fill="#555" font-size="11">safechat — open source crisis safety — github.com/rob-e-graham/safechat</text>
</svg>
