<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2ecc71"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg2)" rx="16"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Independent Verification, Deterministic Merge</text>
  <text x="450" y="66" text-anchor="middle" fill="#888" font-size="13">Each layer examines the message blind — none sees another's verdict. Plain code merges them.</text>

  <!-- User message -->
  <rect x="40" y="215" width="170" height="90" rx="12" fill="#1e1e3a" stroke="#444" stroke-width="1.5"/>
  <text x="125" y="245" text-anchor="middle" fill="#aaa" font-size="11" font-weight="600">USER MESSAGE</text>
  <text x="125" y="268" text-anchor="middle" fill="#fff" font-size="12.5" font-style="italic">"I just want the</text>
  <text x="125" y="286" text-anchor="middle" fill="#fff" font-size="12.5" font-style="italic">noise to stop"</text>

  <!-- Fan-out arrows -->
  <path d="M 215 235 C 270 235, 280 140, 330 140" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 215 260 L 330 260" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 215 285 C 270 285, 280 380, 330 380" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Regex engine -->
  <rect x="335" y="100" width="220" height="80" rx="12" fill="#1e1e3a" stroke="#2ecc71" stroke-width="1.5"/>
  <text x="445" y="125" text-anchor="middle" fill="#2ecc71" font-size="11" font-weight="700">TIER 0 — REGEX ENGINE</text>
  <text x="445" y="146" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">deterministic, always on</text>
  <text x="445" y="166" text-anchor="middle" fill="#999" font-size="11.5">verdict: none</text>

  <!-- Semantic layer -->
  <rect x="335" y="220" width="220" height="80" rx="12" fill="#1e1e3a" stroke="#3498db" stroke-width="1.5"/>
  <text x="445" y="245" text-anchor="middle" fill="#3498db" font-size="11" font-weight="700">TIER 1 — SEMANTIC LAYER</text>
  <text x="445" y="266" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">embedding similarity</text>
  <text x="445" y="286" text-anchor="middle" fill="#999" font-size="11.5">0.81 ≈ "noise in my head to stop"</text>

  <!-- Cross-classifier -->
  <rect x="335" y="340" width="220" height="80" rx="12" fill="#1e1e3a" stroke="#e94560" stroke-width="1.5"/>
  <text x="445" y="365" text-anchor="middle" fill="#e94560" font-size="11" font-weight="700">TIER 3 — CROSS-CLASSIFIER</text>
  <text x="445" y="386" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">local clinical LLM</text>
  <text x="445" y="406" text-anchor="middle" fill="#999" font-size="11.5">verdict: self-harm risk, 0.87</text>

  <!-- Fan-in arrows -->
  <path d="M 560 140 C 615 140, 625 235, 660 235" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 560 260 L 660 260" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 560 380 C 615 380, 625 285, 660 285" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Merge -->
  <rect x="665" y="200" width="195" height="120" rx="12" fill="#16162c" stroke="#f5a623" stroke-width="2"/>
  <text x="762" y="228" text-anchor="middle" fill="#f5a623" font-size="11" font-weight="700">DETERMINISTIC MERGE</text>
  <text x="762" y="250" text-anchor="middle" fill="#fff" font-size="12.5">~20 lines of plain code</text>
  <text x="762" y="270" text-anchor="middle" fill="#999" font-size="11.5">confirm or escalate only</text>
  <text x="762" y="288" text-anchor="middle" fill="#999" font-size="11.5">never downgrade</text>
  <text x="762" y="308" text-anchor="middle" fill="#2ecc71" font-size="12" font-weight="700">result: LOW → helplines</text>

  <!-- Why it matters strip -->
  <rect x="40" y="445" width="820" height="46" rx="10" fill="#16162c" stroke="#333" stroke-width="1"/>
  <text x="450" y="465" text-anchor="middle" fill="#ccc" font-size="12.5" font-weight="600">No layer can argue another's verdict down, because no layer ever sees it.</text>
  <text x="450" y="482" text-anchor="middle" fill="#888" font-size="11.5">A flaky model can only fail toward "no worse than regex alone" — the safety floor is architectural, not instructional.</text>
</svg>
